name: OptiData Enterprise Build

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
        
    - name: Restore dependencies
      run: dotnet restore OptiData.slnx
      
    - name: Build Enterprise Architecture
      run: dotnet build OptiData.slnx --configuration Release --no-restore
      
    - name: Run Unit Tests
      run: dotnet test OptiData.slnx --configuration Release --no-build --verbosity normal
